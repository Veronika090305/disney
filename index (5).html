<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мультфильмы Disney: трекер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый вечерний кинозал, но интерфейс - лёгкий и современный, как хорошее приложение-коллекция
   IDEA: ночное небо заставки; каждый просмотренный фильм зажигает золотой огонёк
   PICTURE: сама коллекция - карточки эпох с кольцами прогресса и плавающая док-панель с общим кольцом
   COLOUR and TYPE: ночная синева, фиолетово-розовая дымка, золото окон; Unbounded + Manrope
   LAYOUT: одна колонка до 880px, липкая панель с вкладками и поиском, док прогресса внизу */
:root{color-scheme:dark;--blue:#13297a;--pink:#e57bc0;--rose:#f6b2d8;--gold:#f7c66b;--gold2:#ffe2a3;--ink:#f5f3ff;--muted:#b4b1dc;--dim:#8b88bd;--glass:rgba(16,24,78,.55);--glass2:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--r:20px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:150px}
body{margin:0;color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:170px;min-height:100vh;-webkit-font-smoothing:antialiased;
background:radial-gradient(120% 60% at 0% 80%,rgba(229,123,192,.34),transparent 60%),radial-gradient(90% 45% at 100% 95%,rgba(140,90,200,.32),transparent 65%),linear-gradient(180deg,#060c2c 0%,#0d1d5c 38%,#1c2f82 66%,#3a2c86 88%,#5a3790 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.8;
background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(1.2px 1.2px at 160px 60px,#ffe9c2,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent),radial-gradient(1.6px 1.6px at 300px 90px,#fff,transparent),radial-gradient(1px 1px at 50px 200px,#d9d4ff,transparent),radial-gradient(1px 1px at 130px 250px,#fff,transparent),radial-gradient(1.3px 1.3px at 270px 260px,#fff,transparent);
background-size:320px 290px;mask-image:linear-gradient(#000 0%,#000 50%,transparent 88%);-webkit-mask-image:linear-gradient(#000 0%,#000 50%,transparent 88%)}
#root{position:relative;z-index:1}
.wrap{max-width:880px;margin:0 auto;padding:0 max(4vw,14px)}
button{font:700 14px Manrope,sans-serif;color:var(--ink);background:none;border:0;cursor:pointer;min-height:40px;border-radius:999px;padding:0 14px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

header{padding:clamp(40px,7vw,80px) 0 26px}
h1{font:700 clamp(36px,6.4vw,58px)/1.02 Unbounded,Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 14px;color:#fff;text-wrap:balance}
h1 span{background:linear-gradient(100deg,var(--gold2),var(--gold) 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;color:var(--muted);max-width:60ch;font-size:17px}
.lead b{color:#fff;font-weight:700}

.toolbar{position:sticky;top:10px;z-index:4;padding:10px;margin:0 0 8px;border-radius:26px;background:rgba(10,16,58,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(3,5,25,.35)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;width:max-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:38px}
.tabs button small{font-size:12px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
.tabs button[aria-selected=true]{background:linear-gradient(180deg,#ffe7b0,var(--gold));color:#2a1a05;box-shadow:0 4px 18px rgba(247,198,107,.35)}
.tabs button[aria-selected=true] small{color:#6b4a12}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.search{position:relative;flex:1 1 220px}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);opacity:.6}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(8,14,52,.55);color:var(--ink);font:500 16px Manrope,sans-serif;padding:0 16px 0 42px;transition:border-color .2s,background .2s}
.search input:focus{border-color:rgba(247,198,107,.6);background:rgba(8,14,52,.8);outline:none}
.search input::placeholder{color:var(--dim)}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
.seg button{color:var(--muted);min-height:36px;font-size:13px;padding:0 12px}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.14);color:#fff}
.ghost{color:var(--muted);font-size:13px;padding:0 10px}
.ghost:hover{color:#fff}
.note{font-size:13px;color:var(--dim);margin:6px 6px 0}
.seg-row{display:flex;gap:8px;align-items:center}

section.studio{margin:30px 0 0}
section.studio[hidden],details.era[hidden],li.film[hidden]{display:none}
.st-head{display:flex;gap:16px;align-items:center;margin:0 0 14px;padding:0 2px}
.st-head h2{margin:0;font:600 clamp(22px,3.4vw,30px)/1.15 Unbounded,Manrope,sans-serif;letter-spacing:-.01em;color:#fff;text-wrap:balance}
.st-head p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:62ch}
.st-head .txt{flex:1}

.ring{--p:0;--s:44px;--t:5px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.ring::before{content:"";position:absolute;inset:var(--t);border-radius:50%;background:#101a5a}
.ring b{position:relative;font:800 12px Manrope,sans-serif;color:var(--gold2);font-variant-numeric:tabular-nums}
.st-head .ring{--s:60px;--t:6px}
.st-head .ring b{font-size:13px}

details.era{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(4,6,30,.25);transition:border-color .2s}
details.era[open]{border-color:rgba(247,198,107,.22)}
details.era>summary{list-style:none;cursor:pointer;padding:14px 16px 14px 18px;display:flex;align-items:center;gap:14px;border-radius:var(--r)}
details.era>summary:hover{background:rgba(255,255,255,.03)}
summary::-webkit-details-marker{display:none}
.era-t{flex:1}
.era-name{display:block;font:600 17px/1.25 Unbounded,Manrope,sans-serif;color:#fff}
.era-sub{display:block;font-size:13px;color:var(--rose);font-weight:700;margin-top:3px}
.era-sub i{font-style:normal;color:var(--dim);font-weight:600}
.chev{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass2);transition:transform .25s,background .2s}
.chev svg{width:14px;height:14px}
details[open]>summary .chev{transform:rotate(180deg);background:rgba(247,198,107,.16)}
.era-desc{margin:-2px 18px 10px;color:var(--muted);font-size:14px}
ul.films{list-style:none;margin:0;padding:0 8px 8px;display:grid;gap:2px}

li.film{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start;border-radius:14px;transition:background .2s}
li.film:hover{background:rgba(255,255,255,.04)}
li.film.done{background:linear-gradient(90deg,rgba(247,198,107,.1),transparent 60%)}
.chk{display:grid;place-items:center;width:44px;height:58px;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:26px;height:26px;border-radius:50%;border:2px solid rgba(180,177,220,.55);display:grid;place-items:center;transition:background .2s,border-color .2s,box-shadow .2s}
.chk:hover .box{border-color:var(--gold2)}
.box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.2s}
.chk input:checked+.box{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(247,198,107,.18),0 0 16px rgba(247,198,107,.6)}
.chk input:checked+.box svg{opacity:1;transform:none}
.chk input:focus-visible+.box{outline:2px solid var(--gold2);outline-offset:3px}
.box.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25);box-shadow:0 0 0 8px rgba(247,198,107,.25),0 0 26px rgba(255,226,163,.9)}}
details.info>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:58px;padding:8px 8px 8px 2px}
.t{font-weight:700;line-height:1.3;font-size:16px}
.t small{display:block;font-weight:500;font-size:13px;color:var(--dim);margin-top:1px}
.t em{font-style:normal;color:var(--rose);font-weight:700;font-variant-numeric:tabular-nums}
.done .t{color:var(--gold2)}
.imdb{font-weight:800;font-size:13px;white-space:nowrap;color:var(--gold2);background:rgba(247,198,107,.12);border:1px solid rgba(247,198,107,.3);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.imdb.na{color:var(--dim);background:var(--glass2);border-color:var(--line)}
.mchev{width:24px;height:24px;display:grid;place-items:center;color:var(--dim);transition:transform .25s}
.mchev svg{width:12px;height:12px}
details.info[open] .mchev{transform:rotate(180deg);color:var(--gold2)}
.body{margin:0 8px 14px 2px;padding:16px;border-radius:16px;background:rgba(6,10,40,.45);border:1px solid var(--line)}
.body p{margin:0 0 14px;max-width:64ch}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--rose);margin:0 0 8px}
.heroes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.heroes span{font-size:13px;font-weight:600;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
textarea{display:block;width:100%;min-height:96px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:rgba(4,8,34,.6);color:var(--ink);font:16px/1.5 Manrope,sans-serif;padding:12px 14px;transition:border-color .2s}
textarea:focus{outline:none;border-color:rgba(247,198,107,.6)}
textarea::placeholder{color:var(--dim)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}
.meta .seen{color:var(--gold2);font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 max(3vw,10px) calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.dock .in{pointer-events:auto;max-width:880px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;align-items:center;padding:14px 18px;border-radius:24px;background:rgba(14,18,64,.78);border:1px solid rgba(247,198,107,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(3,5,25,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.dock .ring{--s:64px;--t:7px;grid-row:span 2;box-shadow:0 0 24px rgba(247,198,107,.25)}
.dock .ring::before{background:#121a5c}
.dock .ring b{font-size:15px}
.btxt{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.btxt span:first-child{font-weight:800}
.btxt span:last-child{font-size:12px;color:var(--dim)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tl{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
.tl b{color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.tb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2) 60%,var(--rose));box-shadow:0 0 10px rgba(247,198,107,.6);transition:width .5s}
@media(max-width:600px){
 .dock .in{grid-template-columns:auto minmax(0,1fr);padding:12px 14px;gap:6px 12px}
 .dock .ring{--s:54px;--t:6px;grid-row:auto}
 .tracks{grid-column:1/-1;gap:10px}
 .tl{flex-direction:column;gap:0}
 .btxt{flex-direction:column;gap:0}
 details.era>summary{padding:12px 12px 12px 14px;gap:10px}
 .ring{--s:40px}
 .era-desc{margin:-2px 14px 10px}
 ul.films{padding:0 4px 6px}
 .body{margin:0 4px 12px 0;padding:14px}
 .st-head .ring{--s:52px}
 html{scroll-padding-top:20px}
 .toolbar{position:static;padding:8px;border-radius:22px}
 .tabs{width:100%}
 .tabs button{flex:1;justify-content:center;padding:0 8px;font-size:13px}
 .tabs button small{display:none}
 .seg-row{width:100%;overflow-x:auto;scrollbar-width:none}
 .seg-row::-webkit-scrollbar{display:none}
 .seg,.ghost{flex:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.who{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 18px;font-size:14px;color:var(--muted)}
.who b{color:#fff}
.who button{min-height:36px;font-size:13px;color:var(--gold2);border:1px solid rgba(247,198,107,.35);background:rgba(247,198,107,.08)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 14px}
.login .card{width:min(420px,100%);padding:28px 24px;border-radius:26px;background:rgba(12,18,62,.78);border:1px solid rgba(247,198,107,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(3,5,25,.55)}
.login h1{font-size:clamp(28px,7vw,36px);margin:0 0 12px}
.login p{color:var(--muted);margin:0 0 18px;font-size:15px}
.login label{display:block;font-size:13px;font-weight:800;color:var(--rose);margin:0 0 6px}
.login input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(4,8,34,.6);color:var(--ink);font:500 16px Manrope,sans-serif;padding:0 14px;margin:0 0 14px}
.login input:focus{outline:none;border-color:rgba(247,198,107,.6)}
.login .err{color:#ffb4c8;min-height:1.2em;margin:0 0 10px;font-size:14px}
.login .go{width:100%;min-height:50px;font-size:16px;color:#2a1a05;background:linear-gradient(180deg,#ffe7b0,var(--gold));box-shadow:0 6px 22px rgba(247,198,107,.35)}
.login .go:disabled{opacity:.7}
.login .hint{font-size:13px;color:var(--dim);margin:12px 0 0}
</style>
</head>
<body>

<script>
{
const ERAS=[
["golden","Золотой век","1937-1942","Первые полнометражные мультфильмы студии: смелые эксперименты, ручная анимация и сказки, ставшие классикой."],
["war","Военные годы и сборники","1942-1949","Во время Второй мировой студия выпускала «пакетные» фильмы - сборники коротких музыкальных новелл."],
["silver","Серебряный век","1950-1967","Возвращение к большим сказкам: принцессы, Питер Пэн, далматинцы. Заканчивается последним фильмом, над которым работал сам Уолт Дисней."],
["bronze","Бронзовый век","1970-1988","Студия ищет себя после смерти Уолта: камерные истории о животных и первые эксперименты с компьютерной графикой."],
["ren","Диснеевский ренессанс","1989-1999","Золотое десятилетие мюзиклов: «Русалочка», «Король Лев», «Аладдин» вернули Диснею славу и «Оскары»."],
["post","Пост-ренессанс","1999-2008","Эксперименты с жанрами - фантастика, комедия, приключения - и переход к 3D-анимации."],
["rev","Эпоха возрождения","2009-2019","Новый расцвет: «Рапунцель», «Холодное сердце», «Зверополис» - хиты для всей семьи."],
["new","Новая эпоха","2021-2026","Мир после пандемии: сиквелы, юбилейный «Заветное желание» и новые оригинальные истории."]
].map(e=>["wdas",...e]).concat([
["pixar","p90","Первые шаги","1995-1999","Первый в мире полностью компьютерный полнометражный мультфильм и первые хиты студии."],
["pixar","p00","Золотая полоса","2001-2009","Десятилетие, когда почти каждый фильм Pixar становился событием и получал «Оскары»."],
["pixar","p10","Сиквелы и новые миры","2010-2019","Продолжения любимых историй и новые миры - от эмоций в голове до Страны мёртвых."],
["pixar","p20","2020-е","2020-2026","Фильмы времён пандемии, премьеры сразу на Disney+ и возвращение в кинотеатры."],
["toon","t90","Первые сиквелы","1990-1999","Студия начинает с кинофильма по «Утиным историям» и первых видеопродолжений классики."],
["toon","t00","Расцвет видеопродолжений","2000-2004","Сиквелы почти ко всем хитам Ренессанса - на видеокассетах и DVD, иногда в кино."],
["toon","t05","Последние сиквелы классики","2005-2008","Приквелы и продолжения «Бэмби», «Мулан», «Тарзана», «Золушки»; в 2007 году выпуск сиквелов свернули."],
["toon","t08","Феи и «Самолёты»","2008-2015","Собственные франшизы студии: феи Динь-Динь и спин-офф «Тачек». В 2018 году студию закрыли."]
]);
const STUDIOS=[
["wdas","Walt Disney Animation Studios","Канон","Официальный «канон» - полнометражные фильмы главной анимационной студии Disney, от «Белоснежки» до Hexed."],
["pixar","Pixar","Pixar","С 2006 года принадлежит Disney. Все полнометражные фильмы студии вышли под маркой Disney - от «Истории игрушек» до «Истории игрушек 5»."],
["toon","DisneyToon Studios: сиквелы и спин-оффы","DisneyToon","Подразделение Disney, выпускавшее продолжения, приквелы и спин-оффы - в основном сразу на видео, иногда в кино."]
];
const F=[
["snow","golden",1937,"Белоснежка и семь гномов","Snow White and the Seven Dwarfs",7.6,"Спасаясь от ревнивой Королевы-мачехи, принцесса находит приют в лесном домике семи гномов. Но Королева находит её и приносит отравленное яблоко.","Белоснежка|Злая Королева|Принц|Ворчун|Простачок|Док"],
["pinocchio","golden",1940,"Пиноккио","Pinocchio",7.4,"Деревянная кукла, оживлённая Голубой Феей, должна доказать, что смела, честна и добра, чтобы стать настоящим мальчиком.","Пиноккио|Джеппетто|Сверчок Джимини|Голубая Фея|Стромболи"],
["fantasia","golden",1940,"Фантазия","Fantasia",7.7,"Концерт-альманах: восемь произведений классической музыки превращены в анимационные истории - от абстракций под Баха до «Ученика чародея».","Микки Маус|Чернобог|Леопольд Стоковский"],
["dumbo","golden",1941,"Дамбо","Dumbo",7.2,"Над слонёнком с огромными ушами смеётся весь цирк, но с помощью мышонка Тимоти он узнаёт, что умеет летать.","Дамбо|Тимоти|миссис Джамбо"],

function rpc(fn,args,keepalive){
  const h={'apikey':CFG.key,'Content-Type':'application/json'};
  if(/^eyJ/.test(CFG.key))h.Authorization='Bearer '+CFG.key;
  return fetch(CFG.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args),keepalive:!!keepalive})
    .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+r.status));return j});
}
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}
}
async function loadProfile(name,pin){
  if(CLOUD){
    const r=await rpc('load_progress',{p_name:name,p_pin:pin});
    return {data:norm(r&&r.data),name:(r&&r.name)||name.trim(),created:r&&r.status==='created'};
  }
  const k='disney-local-'+keyOf(name),p=lsGet(k),h=await sha(pin);
  if(p&&p.pin!==h)throw new Error('wrong_pin');
  if(!p){lsSet(k,{name:name.trim(),pin:h,data:blank()});return {data:blank(),name:name.trim(),created:true}}
  return {data:norm(p.data),name:p.name};
}

function save(keepalive){

  else if(b.id==='collapse'){for(const d of root.querySelectorAll('details'))d.open=false;saveUI()}
});
root.addEventListener('toggle',()=>saveUI(),true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh();else if(dirty)save(true)});
window.addEventListener('pagehide',()=>{if(dirty)save(true)});
